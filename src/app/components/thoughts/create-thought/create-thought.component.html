<section class="container criar-pensamentos ff-inter">
  <header class="header">
    <h2>
      Adicione um <br />
      pensamento novo:
    </h2>
  </header>
  <form>
    <label for="pensamento">Pensamento</label>
    <input
      type="textarea"
      class="input"
      id="pensamento"
      name="pensamento"
      placeholder="O que está pensando?"
      [(ngModel)]="thought.conteudo"
    />
    <label for="autoria">Autoria</label>
    <input
      type="text"
      class="input"
      id="autoria"
      name="autoria"
      placeholder="Autoria ou fonte"
      [(ngModel)]="thought.autoria"
    />
    <label for="modelo">Modelo do card:</label>
    <div class="container-radio">
      <div class="radio-modelo">
        <label for="modelo1">
          <input
            type="radio"
            id="modelo1"
            value="modelo1"
            name="modelo-card"
            [(ngModel)]="thought.modelo"
          />
          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 1</span>
        </label>
        Prévia:
        <div class="modelo modelo1 ff-roboto-mono">
          <img src="../../../../assets/imagens/modelo1.png" alt="Aspas Azuis" />
          <p class="conteudo">{{ thought.conteudo }}</p>
          <p class="autoria">
            <b>{{ thought.autoria }}</b>
          </p>
        </div>
      </div>
      <div class="radio-modelo">
        <label for="modelo2">
          <input
            type="radio"
            id="modelo2"
            value="modelo2"
            name="modelo-card"
            [(ngModel)]="thought.modelo"
          />
          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 2</span>
        </label>
        Prévia:
        <div class="modelo modelo2 ff-roboto-mono">
          <img src="../../../../assets/imagens/modelo2.png" alt="Aspas Ciano" />
          <p class="conteudo">{{ thought.conteudo }}</p>
          <p class="autoria">
            <b>{{ thought.autoria }}</b>
          </p>
        </div>
      </div>
      <div class="radio-modelo">
        <label for="modelo3">
          <input
            type="radio"
            id="modelo3"
            value="modelo3"
            name="modelo-card"
            [(ngModel)]="thought.modelo"
          />
          <div class="custom-radio">
            <span></span>
          </div>
          <span>Modelo 3</span>
        </label>
        Prévia:
        <div class="modelo modelo3 ff-roboto-mono">
          <img
            src="../../../../assets/imagens/modelo3.png"
            alt="Aspas Verdes"
          />
          <p class="conteudo">{{ thought.conteudo }}</p>
          <p class="autoria">
            <b>{{ thought.autoria }}</b>
          </p>
        </div>
      </div>
    </div>
    <div class="acoes">
      <button class="botao" (click)="criarPensamento($event)">Salvar</button>
      <button
        class="botao"
        (click)="cancelarPensamento($event)"
        routerLink="/list-thought"
      >
        Cancelar
      </button>
    </div>
  </form>
</section>
